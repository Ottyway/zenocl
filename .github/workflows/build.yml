name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - name: Unpack
        run: |
          f=$(ls *.zip | head -n1)
          unzip -q "$f" -d work
      - name: Build
        working-directory: work/zenocl
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZenoCL-jar
          path: work/zenocl/build/libs/*.jar
