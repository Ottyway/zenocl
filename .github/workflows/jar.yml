name: jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      # Имя архива задано явно, чтобы дубликат "(3).zip" не мешал
      - name: Unpack
        run: unzip -q zenocl-src.zip -d work
      - name: Build
        working-directory: work/zenocl
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZenoCL-jar
          path: work/zenocl/build/libs/*.jar
